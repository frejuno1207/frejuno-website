<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE連携中…｜FREJUNO 松山住まいタイプ診断</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
         background: #f4f6f9; color: #2c3e50; line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 60px 24px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
  .brand { font-size: 14px; font-weight: 600; color: #2c5f7e; }
  .brand .accent { color: #d97744; }
  .loader { width: 40px; height: 40px; border: 4px solid #eef1f4; border-top-color: #06c755; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; color: #2c3e50; margin-top: 12px; }
  .msg { font-size: 13px; color: #5b6b7c; max-width: 360px; }
  .error-box { background: #fff3eb; color: #c66135; padding: 14px 18px; border-radius: 10px; font-size: 13px; max-width: 380px; }
  .btn { display: block; padding: 12px 22px; margin-top: 18px; border-radius: 10px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn-primary { background: #2c5f7e; color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">FREJUNO <span class="accent">松山住まいタイプ診断</span></div>

  <div id="state-loading">
    <div class="loader"></div>
    <h1>LINEアカウントと連携中…</h1>
    <p class="msg">少々お待ちください（5〜10秒）</p>
  </div>

  <div id="state-success" class="hidden">
    <h1 style="color:#06c755;">✓ 連携完了</h1>
    <p class="msg">結果ページに移動します…</p>
  </div>

  <div id="state-error" class="hidden">
    <div class="error-box" id="error-detail">エラーが発生しました</div>
    <a class="btn btn-primary" href="/diagnosis/diagnosis_lp.html">トップに戻る</a>
  </div>
</div>

<script>
(function lineAuthCallback() {
  const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyG8bGodPqV1FXNpiP2hNsSzW7LYbjtB-tOMBXaXyIJDtwxU7fnnbEm3gcZMUzK5yCjpg/exec';
  const CHANNEL_ID = '2010231455';
  const REDIRECT_URI = 'https://frejuno.com/auth/line.html';
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');

  function showState(id) {
    document.getElementById('state-loading').classList.add('hidden');
    document.getElementById('state-success').classList.add('hidden');
    document.getElementById('state-error').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
  }

  function showError(msg) {
    document.getElementById('error-detail').textContent = msg;
    showState('state-error');
  }

  // 1. エラー or キャンセル
  if (error) {
    showError('LINE連携がキャンセルされました（' + error + '）');
    return;
  }
  if (!code) {
    showError('認証コードが受け取れませんでした。再度お試しください。');
    return;
  }

  // 2. CSRF検証
  let savedState = null;
  try { savedState = sessionStorage.getItem('line_oauth_state'); } catch (e) {}
  if (savedState && state !== savedState) {
    showError('セキュリティ検証エラー（state mismatch）。再度お試しください。');
    return;
  }

  // 3. localStorage から share_code 等を取得
  let shareCode = '', sessionId = '', returnTo = '/me/?src=line_auth_success';
  try {
    shareCode = localStorage.getItem('frejuno_share_code') || '';
    sessionId = localStorage.getItem('frejuno_session_id') || '';
    returnTo = sessionStorage.getItem('line_auth_return_to') || returnTo;
  } catch (e) {}

  // 4. GASにcode送信 -> userId取得
  // Channel SecretはGAS側などサーバー管理に限定し、この静的HTMLには置かない。
  const payload = {
    eventType: 'line_oauth_exchange',
    page: 'auth_callback',
    code: code,
    redirectUri: REDIRECT_URI,
    shareCode: shareCode,
    sessionId: sessionId,
    ts: new Date().toISOString()
  };

  fetch(BACKEND_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(() => {
    // no-corsなので応答は読めない。GAS側で確実にSheets更新されたものとして進む。
    // localStorageに「LINE連携済み」フラグを残す（userIdはGAS側でshareCodeに紐付け）
    try {
      localStorage.setItem('frejuno_line_linked', '1');
      localStorage.setItem('frejuno_line_linked_at', new Date().toISOString());
    } catch (e) {}
    showState('state-success');
    setTimeout(function() {
      window.location.replace(returnTo);
    }, 1200);
  })
  .catch(function(e) {
    showError('連携に失敗しました。時間をおいて再度お試しください。');
  });
})();
</script>
</body>
</html>
