const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwGskOqXnV9teh0sCywn-IGgk0eOAtwGwVRJ7DkmsUXfIHuk4jAC5UyDfyH5v3DJijcKw/exec';

// ============================================================
// Identity (session_id + share_code)
// ============================================================
function getOrCreateSessionId() {
  try {
    let id = localStorage.getItem('frejuno_session_id');
    if (!id) {
      id = 'sess_' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '_' + Math.random().toString(36).slice(2,10)));
      localStorage.setItem('frejuno_session_id', id);
    }
    return id;
  } catch (e) { return 'sess_volatile_' + Date.now(); }
}
function getOrCreateShareCode() {
  try {
    let code = localStorage.getItem('frejuno_share_code');
    if (!code) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 紛らわしい文字除外
      code = '';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      localStorage.setItem('frejuno_share_code', code);
    }
    return code;
  } catch (e) { return 'TMP' + Math.floor(Math.random() * 1000); }
}
const SESSION_ID = getOrCreateSessionId();
// URL ?sc= があれば優先してlocalStorageを上書き（別端末で永続URLから来た時に同一share_codeで動く）
const URL_SC = (new URLSearchParams(window.location.search)).get('sc');
if (URL_SC) { try { localStorage.setItem('frejuno_share_code', URL_SC); } catch (e) {} }
const SHARE_CODE = URL_SC || getOrCreateShareCode();

// ============================================================
// Backend POST (Google Apps Script Web App, fire-and-forget)
// CORS preflight回避のため text/plain で送信。GAS側はJSONとしてパース。
// ============================================================
function postToBackend(eventType, extra) {
  if (!BACKEND_URL) return;
  const payload = Object.assign({
    sessionId: SESSION_ID,
    shareCode: SHARE_CODE,
    eventType: eventType,
    source: state.source,
    page: 'diagnosis_v3',
    ts: new Date().toISOString(),
    typeCode: state.typeCode || null,
    lightAnswers: state.lightAnswers,
    deepAnswers: state.deepAnswers,
    axes: state.lightResult && state.lightResult.axes,
    userAgent: navigator.userAgent,
    referrer: document.referrer || ''
  }, extra || {});
  try {
    const body = JSON.stringify(payload);
    // sendBeacon優先（タブ閉じても飛ぶ）。失敗したらfetch no-corsで代替。
    if (navigator.sendBeacon) {
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      const ok = navigator.sendBeacon(BACKEND_URL, blob);
      if (ok) return;
    }
    fetch(BACKEND_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body,
      keepalive: true
    }).catch(() => {});
  } catch (e) { /* swallow */ }
}

function logEvent(type, data) {
  state.events.push({ t: Date.now(), source: state.source, type, ...data });
  // GA4にもイベント送信
  if (typeof gtag === 'function') {
    try {
      gtag('event', type, Object.assign({
        source: state.source,
        share_code: typeof SHARE_CODE !== 'undefined' ? SHARE_CODE : null,
        type_code: state.typeCode || null
      }, data));
    } catch(e) {}
  }
}

function classifyType(lightAnswers) {
  const tally = { U:0, R:0, M:0, W:0, I:0, F:0, S:0, V:0 };
  for (const q of LIGHT_QUESTIONS) {
    const ansV = lightAnswers[q.id];
    const opt = q.options.find(o => o.v === ansV);
    if (opt && opt.axes) {
      for (const [k,v] of Object.entries(opt.axes)) {
        tally[k] = (tally[k]||0) + v;
      }
    }
  }
  const axisResults = {};
  const picked = (qid) => {
    const q = LIGHT_QUESTIONS.find(item => item.id === qid);
    return q && q.options.find(o => o.v === lightAnswers[qid]);
  };
  const tieByAnswer = (qid, left, right, fallback) => {
    const opt = picked(qid);
    if (opt && opt.axes) {
      const leftScore = opt.axes[left] || 0;
      const rightScore = opt.axes[right] || 0;
      if (leftScore !== rightScore) return leftScore > rightScore ? left : right;
    }
    return fallback;
  };
  const chooseAxis = (key, fallback) => {
    const meta = AXIS_META[key];
    const left = meta.left;
    const right = meta.right;
    const diff = tally[left] - tally[right];
    const selected = diff === 0 ? tieByAnswer(meta.tieQ, left, right, fallback) : (diff > 0 ? left : right);
    const margin = Math.abs(diff);
    axisResults[key] = {
      selected,
      leftScore: tally[left],
      rightScore: tally[right],
      margin,
      certainty: margin / meta.max,
      boundary: margin / meta.max < 0.5,
      tieBroken: diff === 0
    };
    return selected;
  };
  const a1 = chooseAxis('UR', 'R');
  const a2 = chooseAxis('MW', 'W');
  const a3 = chooseAxis('IF', 'F');
  const a4 = chooseAxis('SV', 'S');
  return { code: a1+a2+a3+a4, tally, axes: axisResults };
}

function renderAxisBalance(result) {
  return Object.entries(AXIS_META).map(([key, meta]) => {
    const axis = result.axes[key];
    const total = axis.leftScore + axis.rightScore;
    const rightPct = total === 0 ? 50 : Math.round((axis.rightScore / total) * 100);
    const leftPct = 100 - rightPct;
    return `
      <div class="axis-row">
        <div class="axis-labels"><span>${meta.leftLabel}</span><span>${meta.rightLabel}</span></div>
        <div class="axis-track"><div class="axis-fill" style="width:${rightPct}%; margin-left:${leftPct}%;"></div></div>
        <div class="axis-score"><span>${leftPct}</span><span>${rightPct}</span></div>
      </div>
    `;
  }).join('');
}

function renderBoundaryNote(result) {
  const boundaries = Object.entries(result.axes)
    .filter(([, axis]) => axis.boundary)
    .map(([key]) => AXIS_META[key].boundaryText);
  if (!boundaries.length) return '';
  return `<div class="boundary-note">${boundaries[0]}</div>`;
}

function renderTypeVisual(typeData) {
  const src = `${TYPE_ASSET_BASE}${typeData.code}${TYPE_ASSET_EXT}`;
  return `
    <div class="type-visual">
      <img src="${src}" alt="${typeData.nick}のキャラクター" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="type-visual-fallback" style="display:none;">

}

function getBlindSpot(typeData, result) {
  const code = typeData.code;
  const notes = [];
  if (code[0] === 'U') notes.push('立地の便利さを重視しやすい分、駐車場・騒音・収納量を後回しにしないのがポイントです。');
  else notes.push('広さや静けさを重視しやすい分、通勤・買い物・夜道や周辺道路の使いやすさも確認しておくと安心です。');
  if (code[1] === 'M') notes.push('身軽さを優先する場合も、将来の荷物量や在宅時間の変化を少し見ておくとズレが減ります。');
  else notes.push('余白を求める場合は、修繕・掃除・外構・光熱費など、住み始めてからの手間も一緒に見るのがおすすめです。');
  if (Object.values(result.axes).some(axis => axis.boundary)) notes.push('境界寄りの軸があるため、詳細条件を入れると候補条件がかなり絞りやすくなります。');
  return notes.join('');
}

function renderResultInsights(typeData, result) {
  const tags = (typeData.demandTags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
  const nextInputs = [
    '希望エリア：ざっくりでOK',
    '駐車場：必要台数',
    '住まいの形：賃貸 / 購入 / まだ未定',
    '広さ：1LDK、2LDK、3LDKなど',
    '時期：すぐ / 半年以内 / 1年以内 / 情報収集',
    '築年数・リフォームの許容感'
  ];
  return `
    <div class="insight-section">
      <div class="insight-card">
        <div class="insight-title">合いやすい条件</div>
        <div class="tag-list">${tags}</div>
      </div>
      <div class="insight-card">
        <div class="insight-title">見落としやすいポイント</div>
        <div class="insight-text">${getBlindSpot(typeData, result)}</div>
      </div>
      <div class="insight-card">
        <div class="insight-title">次に入力すると精度が上がる情報</div>
        <ul class="next-list">${nextInputs.map(item => `<li>${item}</li>`).join('')}</ul>
      </div>
    </div>
  `;
}

function buildDeepFlow(branch) {
  const all = DEEP_QUESTIONS.filter(q => !q.branch_only && q.id !== 'q1');
  const priceQs = DEEP_QUESTIONS.filter(q => q.branch_only === (branch === 'rent' ? 'rent' : 'buy'));
  const intent = all.filter(q => ['q2','q3','q4'].includes(q.id));
  const spec = all.filter(q => ['q6','q7','q8','q9','q10'].includes(q.id));
  const behav = all.filter(q => ['q17','q18'].includes(q.id));
  return [...intent, ...spec, ...priceQs, ...behav];
}

function getQuestion(id) {
  return DEEP_QUESTIONS.find(q => q.id === id) || LIGHT_QUESTIONS.find(q => q.id === id);
}

function getAnswerLabel(qid, val) {
  const q = getQuestion(qid);
  if (!q || !q.options) return '';
  if (Array.isArray(val)) {
    return val.map(v => {
      const opt = q.options.find(o => String(o.v) === String(v));
      return opt ? opt.t : v;
    }).join('、');
  }
  const opt = q.options.find(o => String(o.v) === String(val));
  return opt ? opt.t : String(val);
}

  const url = `${RESULT_PAGE_URL}?result=${encodeURIComponent(code)}&src=line_saved_result&sc=${encodeURIComponent(sc)}`;
  return [
    `診断結果: ${code} ${name}`,

    `結果ページ:`,
    url,
    ``,
    `希望条件も入力したいです。`

function sendResultToLine(code, shareCodeOverride) {
  const msg = buildLineMessage(code, shareCodeOverride);
  if (!LINE_OA_ID || LINE_OA_ID === '@your_line_id') {
    // ID未設定時はクリップボードに送信内容をコピー＋アラート

    alert('LINE公式アカウントID未設定のため、送信内容をクリップボードにコピーしました。\n\n' + msg);
    return;
  }
  const encoded = encodeURIComponent(msg);
  window.location.href = `https://line.me/R/oaMessage/${encodeURIComponent(LINE_OA_ID)}/?${encoded}`;
}

    '時期：すぐ / 半年以内 / 1年以内 / 情報収集',
    '築年数・リフォームの許容感'

  main.innerHTML = `
    <div class="completion-thanks">

      <p>${typeData.code} ${typeData.nick}</p>
    </div>

    <div class="type-card">
      ${renderTypeVisual(typeData)}
      <div class="type-result-label">YOUR HOUSING TYPE</div>
      <div class="type-code">${typeData.code}</div>
      <div class="type-nickname">${typeData.nick}</div>
      <div class="type-name">${typeData.name}</div>
      <div class="type-oneliner">${typeData.line}</div>
      <div class="type-match-label">松山での相性</div>
      <div class="type-match">${typeData.match}</div>
    </div>

    ${replayBanner}

    <div class="insight-section">
      <div class="insight-card">
        <div class="insight-title">合いやすい条件</div>
        <div class="tag-list">${tags}</div>
      </div>
      <div class="insight-card">
        <div class="insight-title">次に入力すると精度が上がる情報</div>
        <ul class="next-list">${nextInputs.map(item => `<li>${item}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="cta-section">
      <div class="cta-headline">このタイプに近い探し方を<br>LINEで整理しませんか？</div>
      <div class="cta-sub">希望エリアや駐車場の有無を入れると、条件整理の精度が上がります（任意）</div>
      <button class="btn btn-line" id="lineBtn">LINEで結果を保存する</button>
      <div style="margin-top:8px; font-size:12px; text-align:center;">
        <a href="${LINE_FRIEND_URL}" target="_blank" rel="noopener" id="lineFriendBtn"
           style="color:#06c755; text-decoration:underline;">
          まだ友だち追加していない方はこちら
        </a>
      </div>
      <div style="margin-top:10px; font-size:11px; color:#95a4b3; text-align:center;">
        照会コード <b style="color:#2c5f7e; letter-spacing:0.08em;">${(opts && opts.shareCode) || SHARE_CODE}</b>
      </div>
    </div>

    <div class="cta-section">
      <div class="cta-headline" style="font-size:15px;">もっと詳しく希望条件を入れて、<br>松山の物件マッチングを精密化しますか？</div>
      <div class="cta-sub">希望エリア・予算・築年数・駐車場などを別ページで整理します（任意）</div>
      <button class="btn btn-outline" id="deepBtn">希望条件を入力する</button>
    </div>

    <div class="cta-section">
      <button class="btn btn-secondary" id="restartBtn" style="width:100%;">最初から診断をやり直す</button>
    </div>

    <div class="legal-footer">
      本診断は住まい選びの傾向を整理するための参考情報です。<br>

  const effectiveShareCode = (opts && opts.shareCode) || SHARE_CODE;
  document.getElementById('lineBtn').onclick = () => {

    sendResultToLine(code, effectiveShareCode);
  };
  document.getElementById('deepBtn').onclick = () => {
    logEvent('conditions_link_clicked', { from: 'type_result_replay', typeCode: code, sc: effectiveShareCode });
    window.location.href = `conditions.html?src=type_result_replay&from_type=${encodeURIComponent(code)}&sc=${encodeURIComponent(effectiveShareCode)}`;
  };
  document.getElementById('restartBtn').onclick = () => {
    logEvent('replay_restart', { typeCode: code });
    // パラメータを落としてintroへ
    history.replaceState({}, '', location.pathname);

    state.deepAnswers = {};
    state.currentIdx = 0;
    state.typeCode = null;

}

// ============================================================
// Stage: Deep Diagnostic
// ============================================================
function renderDeep() {
  const q = state.deepFlow[state.currentIdx];
  if (!q) return;
  state.questionStart = Date.now();
  progressWrap.style.display = 'flex';
  nav.style.display = 'flex';

  const total = state.deepFlow.length;
  progressBar.style.width = ((state.currentIdx) / total * 100) + '%';
  progressText.textContent = `詳細 ${state.currentIdx + 1} / ${total}`;
  backBtn.style.visibility = state.currentIdx === 0 ? 'hidden' : 'visible';
  nextBtn.textContent = state.currentIdx === total - 1 ? '結果を見る' : '次へ';

  const labelText = q.required ? '必須' : '任意';
  const help = q.help ? `<div class="q-help">${q.help}</div>` : '';

  let body = '';
  if (q.type === 'single') {
    let lockHint = '';
    let lockedMin = null;
    if (q.lockedBy && state.deepAnswers[q.lockedBy] != null) {
      lockedMin = state.deepAnswers[q.lockedBy];
      lockHint = `<div class="price-locked-hint">前の質問の選択以上のみ選べます</div>`;
    }
    body = lockHint + q.options.map(o => {
      const disabled = lockedMin !== null && Number(o.v) < lockedMin;
      const sel = state.deepAnswers[q.id] === o.v ? 'selected' : '';
      return `<button class="opt ${sel} ${disabled ? 'disabled' : ''}" data-v="${o.v}">${o.t}</button>`;
    }).join('');
  } else if (q.type === 'multi') {
    const max = q.max || 99;
    body = `<div class="opt-multi-hint">最大${max}つまで選択できます</div>` + q.options.map(o => {
      const cur = state.deepAnswers[q.id] || [];
      const sel = cur.includes(o.v) ? 'selected' : '';
      return `<button class="opt ${sel}" data-v="${o.v}">${o.t}</button>`;
    }).join('');
  } else if (q.type === 'town_select') {
    const cur = state.deepAnswers[q.id] || { towns: [], other: '' };
    const townOpts = MATSUYAMA_TOWNS.map(t => {
      const sel = cur.towns.includes(t) ? 'selected' : '';
      return `<button class="opt ${sel}" data-v="${t}" style="display:inline-block;width:auto;margin-right:6px;font-size:13px;padding:8px 12px;">${t}</button>`;
    }).join('');
    body = `
      <div class="opt-multi-hint">選択式（複数可）。リストにないものは下の自由記述へ。スキップも可。</div>
      <div style="margin-bottom:14px;">${townOpts}</div>
      <input type="text" class="text-input" id="otherTown" placeholder="その他（例：市坪西町、椿1丁目）" value="${cur.other || ''}">
    `;
  }

  main.innerHTML = `
    <div class="question">
      <div class="stage-tag deep">詳細条件診断</div>
      <div class="q-label">質問 ${state.currentIdx + 1} ／ ${total}　・　${labelText}</div>
      <div class="q-text">${q.text}</div>
      ${help}
      <div>${body}</div>
    </div>
  `;

  bindDeepHandlers(q);
  updateDeepNext(q);
}

function bindDeepHandlers(q) {
  main.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains('disabled')) return;
      const v = btn.dataset.v;
      const parsedV = isNaN(Number(v)) ? v : Number(v);
      if (q.type === 'single') {
        state.deepAnswers[q.id] = parsedV;
        main.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        logEvent('deep_answer', { qid: q.id, val: parsedV, dwell: Date.now() - state.questionStart });
      } else if (q.type === 'multi') {
        let cur = state.deepAnswers[q.id] || [];
        if (cur.includes(v)) {
          cur = cur.filter(x => x !== v);
          btn.classList.remove('selected');
        } else {
          if (cur.length >= (q.max || 99)) return;
          cur.push(v);
          btn.classList.add('selected');
        }
        state.deepAnswers[q.id] = cur;
      } else if (q.type === 'town_select') {
        let cur = state.deepAnswers[q.id] || { towns: [], other: '' };
        if (cur.towns.includes(v)) {
          cur.towns = cur.towns.filter(x => x !== v);
          btn.classList.remove('selected');
        } else {
          cur.towns.push(v);
          btn.classList.add('selected');
        }
        state.deepAnswers[q.id] = cur;
      }
      updateDeepNext(q);
    };
  });
  const otherInput = document.getElementById('otherTown');
  if (otherInput) {
    otherInput.oninput = () => {
      let cur = state.deepAnswers[q.id] || { towns: [], other: '' };
      cur.other = otherInput.value;
      state.deepAnswers[q.id] = cur;
    };
  }
}

function updateDeepNext(q) {
  if (!q.required) { nextBtn.disabled = false; return; }
  const a = state.deepAnswers[q.id];
  if (q.type === 'multi') nextBtn.disabled = !a || a.length === 0;
  else if (q.type === 'town_select') nextBtn.disabled = false;
  else nextBtn.disabled = a == null || a === '';
}

// ============================================================
// Navigation
// ============================================================
backBtn.onclick = () => {
  if (state.stage === 'light') {
    if (state.currentIdx > 0) {
      state.currentIdx--;
      renderLight();
    }
  } else if (state.stage === 'deep') {
    if (state.currentIdx > 0) {
      state.currentIdx--;
      renderDeep();
    }
  }
};

nextBtn.onclick = () => {
  if (state.stage === 'light') {
    if (state.currentIdx === LIGHT_QUESTIONS.length - 1) {
      renderTypeResult();
      return;
    }
    state.currentIdx++;
    renderLight();
  } else if (state.stage === 'deep') {
    const q = state.deepFlow[state.currentIdx];
    logEvent('deep_next', { qid: q.id, dwell: Date.now() - state.questionStart });

    if (q.id === 'q1') {
      const ans = state.deepAnswers['q1'];
      const newBranch = (ans === 'rent') ? 'rent' : 'buy';
      if (newBranch !== state.branch) {
        state.branch = newBranch;
        state.deepFlow = [DEEP_QUESTIONS[0], ...buildDeepFlow(newBranch)];
        logEvent('deep_branch', { branch: newBranch });
      }
    }

    if (state.currentIdx === state.deepFlow.length - 1) {
      renderFinal();
      return;
    }
    state.currentIdx++;
    renderDeep();
  }
};

// ============================================================
// Stage: Final Result
// ============================================================
function generateSummary() {
  const a = state.deepAnswers;
  const rows = [];
  rows.push(['探している', getAnswerLabel('q1', a.q1)]);
  rows.push(['フェーズ', getAnswerLabel('q3', a.q3)]);
  rows.push(['実現時期', getAnswerLabel('q4', a.q4)]);
  rows.push(['希望エリア', getAnswerLabel('q6', a.q6)]);
  if (a.q7 && (a.q7.towns.length || a.q7.other)) {
    const towns = [...a.q7.towns, a.q7.other].filter(Boolean).join('、');
    rows.push(['具体的な町丁', towns]);
  }
  rows.push(['建物タイプ', getAnswerLabel('q8', a.q8)]);
  rows.push(['間取り', getAnswerLabel('q9', a.q9)]);
  rows.push(['築年数', getAnswerLabel('q10', a.q10)]);
  if (state.branch === 'buy') {
    rows.push(['即決ライン', getAnswerLabel('q13_buy', a.q13_buy)]);
    rows.push(['検討上限', getAnswerLabel('q14_buy', a.q14_buy)]);
    rows.push(['撤退ライン', getAnswerLabel('q15_buy', a.q15_buy)]);
    rows.push(['月々上限', getAnswerLabel('q16_buy', a.q16_buy)]);
  } else {
    rows.push(['即決家賃', getAnswerLabel('q13_rent', a.q13_rent)]);
    rows.push(['検討上限', getAnswerLabel('q14_rent', a.q14_rent)]);
    rows.push(['撤退家賃', getAnswerLabel('q15_rent', a.q15_rent)]);
    rows.push(['初期費用', getAnswerLabel('q16_rent', a.q16_rent)]);
  }
  return rows;
}

function generateDifficultyComment() {
  const a = state.deepAnswers;
  const parts = [];
  const areas = a.q6 || [];
  const builtYear = a.q10;
  const layout = a.q9;
  if (builtYear === 'new_only' || builtYear === '5y') parts.push('築浅条件');
  if (areas.includes('south')) parts.push('松山南部');
  if (areas.includes('center')) parts.push('松山中心部');
  if (layout === '3ldk' || layout === '4ldk') parts.push(`${layout === '3ldk' ? '3LDK' : '4LDK'}クラスの間取り`);

  if (parts.length >= 2) {
    return `${parts.join('・')}の組み合わせは、松山圏での流通量が比較的限られる条件です。希望が明確な分、出てきた時の判断スピードが結果を左右しやすい傾向があります。`;
  }
  if (parts.length === 1) {
    return `${parts[0]}を中心とした条件は、松山圏では一定の流通量があります。条件の優先順位を整理しておくと比較がしやすくなります。`;
  }
  return '希望条件の幅が比較的広く、選択肢の母数が多くなりそうな条件です。優先順位の整理が物件比較のしやすさにつながります。';
}

function generateSuggestions() {
  const a = state.deepAnswers;
  const sugg = [];
  if (a.q10 === 'new_only' || a.q10 === '5y') sugg.push('築年数を「10年以内」まで広げると候補数が大きく増える傾向があります');
  if ((a.q6 || []).length === 1) sugg.push('希望エリアを隣接エリアにも広げると、同条件の物件と出会える可能性が高まります');
  if (state.branch === 'buy') {
    const spread = (a.q15_buy || 0) - (a.q13_buy || 0);
    if (spread <= 500) sugg.push('価格レンジの幅がやや狭めです。条件次第で出せる上限を再検討すると物件選びに余裕が出ます');
  }
  if (a.q17 === 0) sugg.push('まずは1〜2件の内見から始めると、希望条件の実感がつかみやすくなります');
  if (!sugg.length) sugg.push('希望条件は比較的バランスが取れています。物件が出てきた時の判断基準を事前に整理しておくのがお勧めです');
  return sugg.slice(0, 3);
}

function renderFinal() {
  state.stage = 'final';
  progressBar.style.width = '100%';
  progressText.textContent = '完了';
  nav.style.display = 'none';

  const typeData = TYPES[state.typeCode];
  const rows = generateSummary();
  const comment = generateDifficultyComment();
  const sugg = generateSuggestions();
  logEvent('final_complete', { totalDwellMs: Date.now() - (state.events[0]?.t || Date.now()) });
  // Backend保存（詳細回答含む完成版）
  postToBackend('final_complete', { branch: state.branch, summary: rows });

  main.innerHTML = `
    <div class="completion-thanks">
      <h2>詳細診断 完了</h2>
      <p>タイプと詳細条件を統合しました</p>
    </div>

    <div class="type-card">
      ${renderTypeVisual(typeData)}
      <div class="type-result-label">YOUR HOUSING TYPE</div>
      <div class="type-code">${typeData.code}</div>
      <div class="type-nickname">${typeData.nick}</div>
      <div class="type-name">${typeData.name}</div>
      <div class="type-oneliner">${typeData.line}</div>
      <div class="type-match-label">松山での相性</div>
      <div class="type-match">${typeData.match}</div>
    </div>

    <div class="result-section">
      <div class="result-label">入力いただいた詳細条件</div>
      <div class="result-card">
        ${rows.map(r => `<div class="summary-row"><div class="summary-key">${r[0]}</div><div class="summary-val">${r[1]}</div></div>`).join('')}
      </div>
    </div>

    <div class="result-section">
      <div class="result-label">条件の傾向コメント</div>
      <div class="result-card alt">
        <div class="comment-text">${comment}</div>
      </div>
    </div>

    <div class="result-section">
      <div class="result-label">条件の見直し候補</div>
      <div class="result-card">
        ${sugg.map(s => `<div class="suggestion-item">${s}</div>`).join('')}
      </div>
    </div>

    <button class="btn btn-line" id="lineBtnFinal">LINEで結果を保存し、探し方を相談する</button>
    <div style="margin-top:8px; margin-bottom:18px; font-size:12px; text-align:center;">
      <a href="${LINE_FRIEND_URL}" target="_blank" rel="noopener"
         style="color:#06c755; text-decoration:underline;">
        まだ友だち追加していない方はこちら
      </a>
    </div>

    <div class="optional-section">
      <h3>もう少し詳しく教えていただけると、より精度高くお返しできます</h3>
      <div class="help">すべて任意・スキップ可</div>
      <div style="margin-bottom:14px;">
        <div class="q-label" style="margin-bottom:8px;">${state.branch === 'buy' ? '資金計画の検討状況' : '契約手続きの確認状況'}</div>
        <select class="select-input" id="optLoan">
          <option value="">選択してください（任意）</option>
          ${state.branch === 'buy' ? `
            <option value="none">まだ何もしていない</option>
            <option value="research">自分で銀行を調べた程度</option>
            <option value="prep">仮審査の準備中</option>
            <option value="pre_ok">仮審査済み</option>
            <option value="final_ok">本審査済み・承認あり</option>
            <option value="cash">現金で購入予定</option>
          ` : `
            <option value="guarantor">連帯保証人を立てられる</option>
            <option value="company">保証会社利用前提</option>
            <option value="neither">どちらも難しい</option>
            <option value="unknown">まだ確認していない</option>
          `}
        </select>
      </div>
      <div>
        <div class="q-label" style="margin-bottom:8px;">今の住まい探しで一番困っていることがあれば</div>
        <textarea id="optTrouble" placeholder="自由記述・スキップ可"></textarea>
      </div>
      <button class="btn btn-secondary" style="margin-top:12px;width:100%;" id="saveOptBtn">回答を送信して終了</button>
    </div>

    <div class="legal-footer">
      本診断は住まい選びの傾向を整理するための参考情報です。特定の物件、価格、将来価値、融資、購入可否を保証するものではありません。<br>
      回答内容は条件整理、需要分析、関連情報のご案内のために利用します。<br>
      © FREJUNO 松山住まい診断（プロトタイプ v3）
    </div>
  `;

  document.getElementById('lineBtnFinal').onclick = () => {
    logEvent('line_clicked', { from: 'final', typeCode: state.typeCode });
    sendResultToLine(state.typeCode);
  };
  document.getElementById('saveOptBtn').onclick = () => {
    const loan = document.getElementById('optLoan').value;
    const trouble = document.getElementById('optTrouble').value;
    if (loan) state.deepAnswers.optLoan = loan;
    if (trouble) state.deepAnswers.optTrouble = trouble;
    logEvent('opt_submitted', { loan, troubleLen: trouble.length });
    finalize();
  };
}

function finalize() {
  const payload = {
    diagnosisVersion: 'mvp_type_diagnosis_v3_7q',
    source: state.source,
    typeCode: state.typeCode,
    typeData: TYPES[state.typeCode],
    axisScores: state.lightResult?.tally,
    axisResults: state.lightResult?.axes,
    branch: state.branch,
    lightAnswers: state.lightAnswers,
    deepAnswers: state.deepAnswers,
    priceElasticity: state.branch === 'buy'
      ? (state.deepAnswers.q15_buy - state.deepAnswers.q13_buy)
      : (state.deepAnswers.q15_rent - state.deepAnswers.q13_rent),
    seriousnessSignals: {
      phase: state.deepAnswers.q3,
      timeline: state.deepAnswers.q4,
      viewings: state.deepAnswers.q17,
      competition: state.deepAnswers.q18,
      hasOpt: !!state.deepAnswers.optLoan
    },
    events: state.events
  };
  console.log('=== FREJUNO v3 診断データ（プロトタイプ送信ペイロード） ===');
  console.log(JSON.stringify(payload, null, 2));
  alert('ご回答ありがとうございました。\n（プロトタイプではブラウザのコンソールに送信ペイロードを出力しています）');
}

// Start

(function bootstrap() {
  const params = new URLSearchParams(window.location.search);
  const resultCode = (params.get('result') || '').toUpperCase();
  const sc = params.get('sc') || null; // permalink元のshare_code（あれば優先表示）
  if (resultCode && typeof TYPES !== 'undefined' && TYPES[resultCode]) {
    renderTypeResultFromCode(resultCode, { source: state.source, shareCode: sc });
    return;
  }
  renderIntro();
})();
</script>
